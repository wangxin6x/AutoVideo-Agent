name: Publish package to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" build twine

      - name: Validate release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)(?:-(alpha|beta|rc)\.(\d+))?", tag)
          if match is None:
              raise SystemExit(f"Unsupported release tag: {tag}")

          base, channel, number = match.groups()
          suffix = {"alpha": "a", "beta": "b", "rc": "rc"}
          expected = base if channel is None else base + suffix[channel] + number
          with open("pyproject.toml", "rb") as handle:
              package_version = tomllib.load(handle)["project"]["version"]

          if package_version != expected:
              raise SystemExit(
                  f"Release tag {tag} expects package version {expected}, "
                  f"but pyproject.toml declares {package_version}"
              )
          print(f"Validated {tag} against package version {package_version}")
          PY

      - name: Run tests
        run: python -m pytest

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish validated distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/autovideo-agent
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
